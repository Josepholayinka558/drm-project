<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DRM System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css">
</head>
<body class="bg-white text-gray-900 font-sans flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md px-6 py-12 border border-gray-100 rounded-[2rem] shadow-sm">
        <!-- Logo -->
        <div class="flex justify-center mb-10">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center">
                    <i class="fas fa-microchip text-white text-lg"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight">DRM System</span>
            </a>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold tracking-tight mb-2">Welcome back</h1>
            <p class="text-gray-500">Sign in to manage departmental resources</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@university.edu" class="w-full px-5 py-3 rounded-2xl border border-gray-200 focus:border-black outline-none transition text-sm">
            </div>
            
            <div>
                <label for="password" class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-5 py-3 rounded-2xl border border-gray-200 focus:border-black outline-none transition text-sm">
            </div>
            
            <button type="submit" id="login-btn" class="w-full bg-black text-white font-bold py-4 rounded-2xl hover:bg-gray-800 transition flex items-center justify-center gap-2 mt-8">
                <span id="btn-text">Sign In</span>
                <i class="fas fa-arrow-right text-xs"></i>
                <div id="loader" class="hidden animate-spin rounded-full h-4 w-4 border-t-2 border-b-2 border-white ml-2"></div>
            </button>
        </form>
        
        <div class="mt-10 pt-10 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-500">
                Don't have an account? 
                <a href="register.html" class="text-black font-bold hover:underline">Create account</a>
            </p>
            <a href="index.html" class="inline-flex items-center gap-2 text-xs text-gray-400 hover:text-black mt-6 transition font-medium">
                <i class="fas fa-chevron-left text-[10px]"></i> Back to Home
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
